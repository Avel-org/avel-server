name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # A real database, so database tests run here instead of skipping.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/avel_test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Docs agree with each other
        run: pnpm docs:check
      - name: Time and IDs come only from lib/clock and lib/ids
        run: pnpm determinism:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
