name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # A real database, so database tests run here instead of skipping.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/avel_test
      # The check runner's tests run real containers on the runner's Docker,
      # so they run here instead of skipping. Pinned by digest, as
      # AVEL_CHECK_IMAGE must be.
      AVEL_DOCKER_TEST_IMAGE: node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull the check runner's test image
        run: docker pull "$AVEL_DOCKER_TEST_IMAGE"
      - name: Docs agree with each other
        run: pnpm docs:check
      - name: Time and IDs come only from lib/clock and lib/ids
        run: pnpm determinism:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
